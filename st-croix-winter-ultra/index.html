<style>
/* ---------------------------------------------------------------
   Palette — winter on the St Croix: frost, river ice, spruce.
   --------------------------------------------------------------- */
:root {
  --sky-top:  #b9cfdd;
  --sky-mid:  #d6e3eb;
  --sky-low:  #edf3f6;
  --snow:     #fbfdfe;
  --surface:  #ffffff;
  --page:     #f3f7f9;
  --ink:      #17303f;
  --ink-soft: #526a78;
  --line:     #d3dfe6;
  --spruce:   #2c4a50;
  --bark:     #4a3f3a;
  --accent:   #4f7f9b;
  --contour:  #5f8ba6;
  --animal:   #3b3a3c;
  --eagle:    #3b3a3c;
  --flake:    rgba(255, 255, 255, .95);
  --shadow:   rgba(23, 48, 63, .18);
}

@media (prefers-color-scheme: dark) {
  :root {
    --sky-top:  #0b1622;
    --sky-mid:  #172838;
    --sky-low:  #24394a;
    --snow:     #c9d8e2;
    --surface:  #142330;
    --page:     #0e1a25;
    --ink:      #eef5f9;
    --ink-soft: #a5b8c5;
    --line:     #2a3f50;
    --spruce:   #0f2027;
    --bark:     #1b2024;
    --accent:   #8fbcd6;
    --contour:  #7fa9c4;
    --animal:   #0a1218;
    --eagle:    #5d7385;
    --flake:    rgba(255, 255, 255, .7);
    --shadow:   rgba(0, 0, 0, .5);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 1.125rem;
  line-height: 1.6;
}

/* ---------------------------------------------------------------
   Hero: contours behind the title, wildlife along the bottom.
   --------------------------------------------------------------- */
.hero {
  position: relative;
  display: grid;
  place-items: center;
  min-height: min(88vh, 760px);
  padding: 48px 16px 250px;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
  overflow: hidden;
}

.topo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  -webkit-mask-image: radial-gradient(ellipse 42% 26% at 50% 38%, transparent 35%, #000 100%);
  mask-image: radial-gradient(ellipse 42% 26% at 50% 38%, transparent 35%, #000 100%);
}
.topo path { fill: none; stroke: var(--contour); }
.topo .minor { stroke-width: .7; opacity: .42; }
.topo .major { stroke-width: 1.4; opacity: .7; }
.topo text {
  fill: var(--ink-soft);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-anchor: middle;
  paint-order: stroke;
  stroke: var(--sky-mid);
  stroke-width: 7px;
  stroke-linejoin: round;
}

h1 {
  position: relative;
  z-index: 3;
  max-width: 14em;
  margin: 0;
  font-size: clamp(2.75rem, 10vw, 5rem);
  font-weight: 700;
  letter-spacing: .01em;
  line-height: 1.08;
  text-align: center;
}
h1::after {
  content: "";
  display: block;
  width: 96px;
  height: 4px;
  margin: 16px auto 0;
  background: var(--accent);
}

.eagle {
  position: absolute;
  z-index: 2;
  top: 9%;
  right: 13%;
  width: clamp(84px, 11vw, 140px);
  height: auto;
}

.scene {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: 0;
  display: block;
  width: 100%;
  height: 262px;
}
.scene .tree   { fill: var(--spruce); }
.scene .bark   { fill: var(--bark); }
.scene .cap    { fill: var(--snow); opacity: .9; }
.scene .ground { fill: var(--snow); }
.scene .animal { fill: var(--animal); color: var(--animal); }

/* Each layer is one tile of flakes, so moving by whole tiles loops cleanly. */
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  z-index: 4;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle 2px at 30px 40px, var(--flake) 98%, transparent),
    radial-gradient(circle 3px at 120px 90px, var(--flake) 98%, transparent),
    radial-gradient(circle 2px at 190px 30px, var(--flake) 98%, transparent),
    radial-gradient(circle 2px at 70px 170px, var(--flake) 98%, transparent),
    radial-gradient(circle 3px at 210px 200px, var(--flake) 98%, transparent);
  background-size: 240px 240px;
}
.hero::after {
  opacity: .6;
  background-size: 160px 160px;
}

@media (prefers-reduced-motion: no-preference) {
  .hero::before { animation: fall-near 16s linear infinite; }
  .hero::after  { animation: fall-far 22s linear infinite; }
  @keyframes fall-near { to { background-position: 240px 480px; } }
  @keyframes fall-far  { to { background-position: -160px 320px; } }
}

/* ---------------------------------------------------------------
   The rig: fat bike photo and a scrolling gear list.
   --------------------------------------------------------------- */
main {
  max-width: 920px;
  margin: 0 auto;
  padding: 44px 16px 64px;
}
main h2 {
  margin: 0 0 20px;
  font-size: 1.75rem;
  line-height: 1.2;
}
.rig {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap: 28px;
  align-items: start;
}

/* Replace .photo-slot with an <img> once the fat bike photo is ready. */
.photo-slot {
  display: grid;
  place-items: center;
  aspect-ratio: 4 / 3;
  margin: 0;
  border: 2px dashed var(--line);
  border-radius: 12px;
  color: var(--ink-soft);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: .875rem;
}

.gear h3 {
  margin: 0 0 10px;
  font-size: 1.25rem;
}
.gear-list {
  height: 340px;
  margin: 0;
  padding: 4px 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: 0 8px 20px -12px var(--shadow);
  list-style: none;
}
.gear-list:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.gear-list li {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.35;
}
.gear-list li:last-child { border-bottom: 0; }

@media (max-width: 680px) {
  .rig { grid-template-columns: minmax(0, 1fr); }
  .gear-list { height: 300px; }
}
</style>
